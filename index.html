<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descent '90s Tunnel</title>
  <style>
    :root {
      color-scheme: dark;
      --hud: #7fffd4;
      --warn: #ff7b7b;
      --bg: #05070b;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #11182a 0%, var(--bg) 65%);
      font-family: "Consolas", "Courier New", monospace;
      overflow: hidden;
    }
    #game {
      display: block;
      margin: 0 auto;
      width: min(100vw, 1200px);
      height: min(100vh, 800px);
      image-rendering: pixelated;
      border: 2px solid #0d1526;
      box-shadow: 0 0 32px rgba(127, 255, 212, 0.2);
      background: #000;
    }
    #overlay {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 8px;
      width: min(100vw, 1200px);
      pointer-events: none;
      color: var(--hud);
      text-shadow: 0 0 8px rgba(127,255,212,.5);
      font-size: 14px;
      line-height: 1.2;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 0 12px;
    }
    .warning { color: var(--warn); }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="640"></canvas>
  <div id="overlay" aria-hidden="true">
    <div class="row"><span>DESCENT // RETRO TRAINING SIM</span><span id="fps">FPS --</span></div>
    <div class="row"><span id="status">WASD move · Q/E strafe · Arrow keys look · Space fire · F flare</span><span id="flareState">Flares: 8</span></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
